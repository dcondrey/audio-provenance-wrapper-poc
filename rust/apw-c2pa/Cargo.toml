[package]
name = "apw-c2pa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
apw-core.workspace = true
c2pa.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# The sidecar path must hand c2pa-rs a seekable sink for the verbatim asset copy it
# writes while returning the detached JUMBF. A Cursor would hold the whole asset in RAM.
tempfile.workspace = true

[dev-dependencies]
rcgen.workspace = true
time.workspace = true
