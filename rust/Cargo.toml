[workspace]
resolver = "2"
members = [
    "apw-core",
    "apw-assoc",
    "apw-audio",
    "apw-c2pa",
    "apw-provenance",
    "apw-daemon",
    "apw-cli",
    "apw-ffi",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
apw-core = { path = "apw-core" }
apw-audio = { path = "apw-audio" }
apw-assoc = { path = "apw-assoc" }
apw-c2pa = { path = "apw-c2pa" }
apw-provenance = { path = "apw-provenance" }
apw-daemon = { path = "apw-daemon" }
apw-cli = { path = "apw-cli" }

# rust_native_crypto replaces the default `openssl` backend: an OpenSSL-linked
# build has to be vendored per slice before `lipo`, and the two slices must agree.
c2pa = { version = "0.90.16", default-features = false, features = ["rust_native_crypto", "file_io"] }

serde = { version = "1.0.228", features = ["derive"] }
# REQUIRED: preserve_order keeps the pretty manifest in Python's insertion order.
# Canonicalization sorts explicitly and never relies on map iteration order.
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
thiserror = "2.0.17"
sha2 = "0.10.9"
hmac = "0.12.1"
subtle = "2.6.1"
zeroize = { version = "1.8.2", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
getrandom = "0.2.16"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
x509-parser = "0.18.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5.53", features = ["derive"] }
log = "0.4.28"
env_logger = "0.11.8"
tempfile = "3.24.0"
libc = "0.2.189"
# TLS for https time-anchor endpoints. The `ring` provider is REQUIRED: rustls'
# default `aws-lc-rs` needs a per-slice C toolchain and breaks the lipo build, the
# same reason c2pa uses rust_native_crypto. ring is already in the tree via c2pa.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha1 = "0.11.0"
ripemd = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
