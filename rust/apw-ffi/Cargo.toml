[package]
name = "apw-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "apw_engine"
# staticlib is what a JUCE plug-in links; cdylib covers a host that would rather
# load the engine at runtime. rlib keeps the crate testable from cargo test.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
apw-cli.workspace = true
apw-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
