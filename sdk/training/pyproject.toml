[project]
name = "apw-watermark-neural-training"
version = "0.1.0"
description = "PyTorch training harness for Watermark-N (apw-watermark-neural-v1), the learned acoustic mark specified in docs/WATERMARK_N_SPEC.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.7.1",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "scipy>=1.14",
    "soundfile>=0.13",
    "torch>=2.6",
]

[project.scripts]
apw-watermark-neural-train = "apw_watermark_neural.train:main"
apw-watermark-neural-calibrate = "apw_watermark_neural.calibrate:main"
apw-watermark-neural-evaluate = "apw_watermark_neural.evaluate:main"
apw-watermark-neural-export = "apw_watermark_neural.export_onnx:main"
apw-watermark-neural-modelcard = "apw_watermark_neural.model_card:main"
apw-watermark-neural-parity = "apw_watermark_neural.parity:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apw_watermark_neural"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
