[project]
name = "genomark-n-training"
version = "0.1.0"
description = "PyTorch training harness for GenoMark-N (genomark-neural-v1), the learned acoustic mark specified in docs/GENOMARK_N_SPEC.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.7.1",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "scipy>=1.14",
    "soundfile>=0.13",
    "torch>=2.6",
]

[project.scripts]
genomark-n-train = "genomark_n.train:main"
genomark-n-calibrate = "genomark_n.calibrate:main"
genomark-n-evaluate = "genomark_n.evaluate:main"
genomark-n-export = "genomark_n.export_onnx:main"
genomark-n-modelcard = "genomark_n.model_card:main"
genomark-n-parity = "genomark_n.parity:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomark_n"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
