[package]
name = "audio-provenance-core"
description = "Canonical JSON, Ed25519 manifest signing, and the provenance vocabulary shared by the Audio Provenance crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "hex/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "zeroize/std",
]

[dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
