[package]
name = "audio-provenance-cli"
description = "The `audio-provenance` command line: verify, sign, embed, inspect, keygen and registry management. Renders SDK verdicts and maps them to exit codes; contains no provenance logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "audio-provenance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
apw-watermark = { workspace = true }
audio-provenance-audio = { workspace = true }
audio-provenance-core = { workspace = true, features = ["std"] }
audio-provenance-manifest = { workspace = true, features = ["std"] }
audio-provenance-registry = { workspace = true, features = ["http"] }
audio-provenance-sdk = { workspace = true }
audio-provenance-trust = { workspace = true }
apw-trace = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
