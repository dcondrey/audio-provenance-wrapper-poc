[package]
name = "audio-provenance-registry"
description = "Queryable repository of signed Audio Provenance manifests, indexed by GenoMark id and content hash."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["std", "local", "http"]
std = ["audio-provenance-core/std", "hex/std", "serde/std", "serde_json/std", "thiserror/std"]
local = ["std"]
http = ["std", "dep:ureq"]

[dependencies]
audio-provenance-core = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
