[project]
name = "audio-provenance-capture-rig"
version = "0.1.0"
description = "Stage 0 physical capture campaign harness for Watermark-N: playback/capture, room measurement, campaign matrix, and blind detection reporting. See docs/WATERMARK_N_SPEC.md section 10."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.13",
    "sounddevice>=0.5.1",
    "pyyaml>=6.0",
]

[project.scripts]
capture-rig = "capture_rig.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
